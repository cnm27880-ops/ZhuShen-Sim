<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>主神空間主管模擬器</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 上面：積分、時間、速度控制、暫停 -->
    <header id="topbar">
      <div class="brand"><span class="brand-orb"></span><span>主神空間<small>主管終端 v0.1</small></span></div>
      <div class="stat"><span class="stat-label">主神公庫</span><span id="points" class="stat-value">0</span></div>
      <div class="stat" title="副本結算先抽稅入公庫，剩下由存活隊員平分成私房錢。稅率高：公庫肥但理智下降；稅率低：輪迴者有錢自己逛街、強化。">
        <span class="stat-label">稅率</span>
        <span class="tax-ctl"><button data-action="tax-down" title="降低稅率">−</button><span id="tax-rate" class="stat-value small">40%</span><button data-action="tax-up" title="提高稅率">＋</button></span>
      </div>
      <div class="stat">
        <span class="stat-label" id="day-label">第 1 天</span>
        <div id="day-bar"><div id="day-bar-fill"></div></div>
      </div>
      <div class="stat"><span class="stat-label">空間等級</span><span id="space-level" class="stat-value small">Lv.1</span></div>
      <div class="stat"><span class="stat-label">每日維持費</span><span id="upkeep" class="stat-value small">0</span></div>
      <div class="stat"><span class="stat-label">因果結晶</span><span id="karma" class="stat-value small">🔮 0</span></div>
      <div id="speed-controls"></div>
      <button id="btn-pause" data-action="toggle-pause" title="空白鍵：暫停／繼續">⏸ 暫停 [Space]</button>
      <button id="btn-gossip" data-action="open-gossip" title="《主神八卦日報》：把本局的修羅場、頭條與英靈碑畫成圖卡，可下載 PNG">📰 八卦日報</button>
      <button id="btn-squad" data-action="open-squad" title="小隊指揮部：隊長、流派、先人遺物、空間編年史">👑 小隊指揮部</button>
      <button id="btn-guide" data-action="open-guide" title="新任主神上崗手冊">❓ 上崗手冊</button>
      <button data-action="open-settings" title="設定">⚙️</button>
    </header>

    <!-- 自動暫停時顯示原因 -->
    <div id="banner" style="display: none"></div>

    <main>
      <!-- 左邊：主神空間俯視圖／副本路線圖 -->
      <section id="stage">
        <div id="space-map"></div>
        <div id="dungeon-view" style="display: none"></div>
        <div id="run-list" style="display: none"></div>
      </section>

      <!-- 右邊：主神監控日誌 -->
      <aside id="log-panel">
        <h2>主神監控日誌<span class="rec">REC</span></h2>
        <div id="log"></div>
      </aside>
    </main>

    <!-- 下面：操作按鈕 + 輪迴者列表 -->
    <footer>
      <div id="actions">
        <button class="primary" data-action="open-dispatch">🚪 派遣</button>
        <button class="primary" data-action="open-gacha">🎴 抽卡</button>
        <button data-action="open-relations">💞 關係</button>
        <button id="btn-wishes" class="primary" data-action="open-wishes" style="display: none">🙏 許願</button>
        <button id="btn-stele" data-action="open-stele">🪦 英靈碑</button>
        <button id="btn-mandatory" class="primary" data-action="open-mandatory" style="display: none">☠️ 強制任務</button>
        <button id="btn-rival" class="primary" data-action="open-rival" style="display: none">⚔️ 洲際碰撞</button>
        <button id="btn-god" class="primary" data-action="open-god" style="display: none">👁 主神搞事</button>
        <button class="primary" data-action="open-shop">🛒 商店</button>
        <button id="btn-facility" data-action="open-facility" title="主神空間永久基建：重力修煉室、生命溫養艙、法則共鳴碑、萬界育嬰堂、星界觀測樞">🏗️ 基建</button>
        <label class="toggle"><input type="checkbox" id="auto-dispatch" /> 🤖 自動派遣</label>
        <label class="toggle" title="自動派遣只挑打得過的任務槽：保守 = 隊伍戰力 ≥ 推薦戰力 ×1.2；穩健 ×1.0（新手期 ×0.85）；狂暴 ×0.8。全部打不過就待機休整。">🧭
          <select id="auto-strategy"><option value="safe">保守</option><option value="balanced">穩健</option><option value="aggressive">狂暴</option></select></label>
        <label class="toggle" id="auto-erosion-wrap" style="display: none" title="自動派遣在主線卡關或全通後，改打已通關世界的位面侵蝕星級賺結晶"><input type="checkbox" id="auto-erosion" /> 🌌 自動挑戰侵蝕</label>
        <label class="toggle"><input type="checkbox" id="protect-injured" /> 禁止自動派遣受傷人員</label>
        <label class="toggle"><input type="checkbox" id="protect-enemies" /> 禁止仇恨／死敵同隊</label>
      </div>
      <div id="roster"></div>
    </footer>

    <!-- 彈出視窗 -->
    <div id="modal-backdrop" style="display: none"><div id="modal"></div></div>

    <script type="module" src="src/ui/main.js"></script>
  </body>
</html>
